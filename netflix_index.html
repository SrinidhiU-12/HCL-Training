<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone Page</title>
    <link rel="stylesheet" href="netflix_style.css">
</head>

<body>

    <div class="hero">

        <!-- Header section -->
        <header>
            <div class="logo">NETFLIX</div>

            <div class="header-right">
                <select>
                    <option>English</option>
                    <option>Tamil</option>
                    <option>Hindi</option>
                </select>

                <button class="signin">Sign In</button>
            </div>
        </header>


        <!-- Center Content -->
        <main class="content">

            <h1>
                Laughs. Tears. Thrills.<br>
                It is all here.
            </h1>

            <h3>Starts at ₹149. Cancel at any time.</h3>

            <p>
                Ready to watch? Enter your email to create or restart your membership.
            </p>

            <div class="email-box">
                <input type="email" placeholder="Email address">
                <button class="get-started">
                    Get Started
                    <span>›</span>
                </button>
            </div>

        </main>

    </div>

</body>
</html>
