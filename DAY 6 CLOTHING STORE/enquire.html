
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquire Now | StyleNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand brand" href="index.html">StyleNest.</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link active" href="enquire.html">Enquire Now</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="container section-space">
    <h1 class="section-title">Your Style Starts Here</h1>
    <p class="text-center text-muted mb-4">Tell us what you are looking for.</p>

    <div class="form-card enquiry-card">
        <form onsubmit="handleForm(event, 'enquiry')">

            <label class="form-label">Full Name</label>
            <input type="text" id="enquiryName" class="form-control mb-3" placeholder="Enter your name" required>

            <label class="form-label">Email Address</label>
            <input type="email" class="form-control mb-3" placeholder="you@example.com" required>

            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control mb-3" placeholder="Enter your phone number"
                pattern="[0-9]{10}" title="Enter a 10-digit phone number" required>

            <label class="form-label">Choose a Product</label>
            <select id="enquiryProduct" class="form-select mb-3" required>
                <option value="">Select a product</option>
                <option>Classic T-Shirt</option>
                <option>Blue Jeans</option>
                <option>Stylish Jacket</option>
                <option>Women's Trousers</option>
                <option>Elegant Dress</option>
                <option>Black T-Shirt</option>
                <option>Leather Jacket</option>
                <option>Trendy Outfit</option>
                <option>Modern Fashion Wear</option>
                <option>Casual Collection</option>
            </select>

            <label class="form-label">Your Message</label>
            <textarea class="form-control mb-4" rows="4" placeholder="Tell us your size, colour or questions" required></textarea>

            <button type="submit" class="btn btn-primary w-100">Submit Enquiry</button>
            <p id="enquirySuccess" class="success-message" hidden></p>

        </form>
    </div>
</section>

<footer><p>© 2026 StyleNest. All rights reserved.</p></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
