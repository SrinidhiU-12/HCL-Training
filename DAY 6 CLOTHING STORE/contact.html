
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | StyleNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand brand" href="index.html">StyleNest.</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="enquire.html">Enquire Now</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="container section-space">
    <h1 class="section-title">Let's Talk!</h1>
    <p class="text-center text-muted mb-5">Have a question? We are happy to help.</p>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="info-card contact-info">
                <h3>Get in Touch</h3>
                <p><strong>Email:</strong> clothingstore@example.com</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <p><strong>Location:</strong> Dindigul, Tamil Nadu</p>
                <a href="enquire.html" class="btn btn-primary">Product Enquiry</a>
            </div>
        </div>

        <div class="col-md-7">
            <form class="form-card" onsubmit="handleForm(event, 'contact')">
                <label class="form-label">Your Name</label>
                <input type="text" id="contactName" class="form-control mb-3" required>

                <label class="form-label">Your Email</label>
                <input type="email" class="form-control mb-3" required>

                <label class="form-label">Your Message</label>
                <textarea class="form-control mb-3" rows="4" required></textarea>

                <button class="btn btn-primary w-100">Send Message</button>
                <p id="contactSuccess" class="success-message" hidden></p>
            </form>
        </div>
    </div>
</section>

<footer><p>© 2026 StyleNest. All rights reserved.</p></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
